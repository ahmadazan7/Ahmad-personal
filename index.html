<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffeef5">

<title>Proposal 💖</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Georgia,serif;
}

body{
    overflow:hidden;
    background:linear-gradient(135deg,#fff7fa,#ffe5ef);
    color:#7d2849;
}

.app{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.card{
    width:min(94vw,520px);
    min-height:650px;
    max-height:94dvh;
    overflow:auto;
    background:rgba(255,255,255,.82);
    border:1px solid rgba(232,62,140,.18);
    border-radius:30px;
    padding:34px 24px;
    box-shadow:0 18px 60px rgba(150,45,90,.16);
    text-align:center;
}

.hidden{
    display:none!important;
}

h1{
    font-size:clamp(28px,7vw,42px);
    line-height:1.2;
    margin:80px 0 18px;
}

p{
    font-family:Arial,sans-serif;
    color:#666;
    font-size:16px;
    line-height:1.5;
}

.heart{
    font-size:70px;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    50%{transform:scale(1.12)}
}

.buttons{
    height:150px;
    position:relative;
    margin-top:25px;
}

button{
    border:0;
    border-radius:16px;
    padding:14px 26px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.yes{
    background:#e83e8c;
    color:white;
}

.no{
    background:#777;
    color:white;
    position:absolute;
    left:55%;
    top:35px;
}

.next{
    background:#e83e8c;
    color:white;
    margin-top:25px;
}

.input{
    width:100%;
    padding:14px;
    border:1px solid #efb7cc;
    border-radius:14px;
    font-size:16px;
    margin:8px 0 18px;
}

label{
    display:block;
    text-align:left;
    font-family:Arial,sans-serif;
    font-weight:bold;
    margin-top:15px;
    color:#7d2849;
}

.final h1{
    margin-top:40px;
}

.final-message{
    font-size:clamp(22px,6vw,32px);
    font-weight:bold;
    line-height:1.45;
}

.small{
    font-size:13px;
    color:#888;
}

.toast{
    font-family:Arial,sans-serif;
    color:#e83e8c;
    font-weight:bold;
    min-height:24px;
    margin-top:8px;
}

.confetti{
    position:fixed;
    top:-30px;
    pointer-events:none;
    z-index:20;
    font-size:22px;
    animation:fall 3s linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}
.loading .app{
    visibility:hidden;
}
</style>
</head>

<body class="loading">

<div class="app">

<main class="card">

<!-- PAGE 1 -->

<section id="page1">

<div class="heart">💖</div>

<h1 id="question">
Will you marry me?
</h1>

<p id="message">
Choose wisely... 😋❤️
</p>

<div class="buttons" id="buttonArea">

<button class="yes" id="yesBtn">
YES ♥
</button>

<button class="no" id="noBtn">
NO 😏
</button>

</div>

<div class="toast" id="runMsg"></div>

</section>


<!-- PAGE 2 -->

<section id="page2" class="hidden">

<div class="heart">🥰</div>

<h1 id="page2Title">
YOU MINE<br>
YOU HAVE TO<br>
SAY YES BABE 😋
</h1>

<p>
I was waiting for that answer! ❤️
</p>

<button class="next" id="page2Btn">
Okay okay! →
</button>

</section>


<!-- PAGE 3 -->

<section id="page3" class="hidden">

<div class="heart">📅</div>

<h1 id="dateText">
Choose Date
</h1>

<label>
Pick a Day 📅
</label>

<input
class="input"
id="date"
type="date"
>

<label>
What Time? ⏰
</label>

<input
class="input"
id="time"
type="time"
>

<div
class="toast"
id="dateMsg">
</div>

<button
class="next"
id="dateBtn">
Set the Date! ♥
</button>

</section>


<!-- PAGE 4 -->

<section id="page4" class="hidden final">

<div class="heart">💍</div>

<h1>
🎉 Congratulations! 🎉
</h1>

<div
class="final-message"
id="finalMessage">
Congratulations ❤️
</div>

<button class="next" id="replyPageBtn">
💌 Send a Reply
</button>

<p>
💖 💍 🎊 ❤️ 🎉
</p>

<p
class="small"
id="madeBy">
Made with ❤️
</p>

<p
class="small"
id="madeBy">
Made with ❤️
</p>

</section>


<!-- PAGE 5 -->

<section id="page5" class="hidden">

<div class="heart">💌</div>

<h1>
Send a Reply ❤️
</h1>

<p>
Say something to the person who sent you this proposal.
</p>

<textarea
class="input"
id="replyMessage"
placeholder="Write your message here ❤️"
style="min-height:140px;resize:vertical;"
></textarea>

<div class="toast" id="replyMsg"></div>

<button class="next" id="replyBtn">
💌 Send Reply
</button>

</section>

</main>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* ================================
   FIREBASE
================================ */

const firebaseConfig = {

    apiKey:
    "AIzaSyDrAe8SGY0btDHndd4q-yJLJF-LFuBnEts",

    authDomain:
    "proposal-maker-9f37a.firebaseapp.com",

    projectId:
    "proposal-maker-9f37a",

    storageBucket:
    "proposal-maker-9f37a.firebasestorage.app",

    messagingSenderId:
    "375603541628",

    appId:
    "1:375603541628:web:ac65e3f76686af1090fbf9"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


/* ================================
   GET PROPOSAL ID
================================ */

const params =
    new URLSearchParams(window.location.search);

const proposalId =
    params.get("id");

console.log("Proposal ID:", proposalId);


/* ================================
   PAGE SYSTEM
================================ */

function showPage(number){

    document
        .querySelectorAll("section")
        .forEach(section => {

            section.classList.add("hidden");

        });

    document
        .getElementById("page" + number)
        .classList.remove("hidden");

}


/* ================================
   NO BUTTON
================================ */

const noBtn =
    document.getElementById("noBtn");

const area =
    document.getElementById("buttonArea");

const runMsg =
    document.getElementById("runMsg");

let escapes = 0;


function moveNo(){

    const a =
        area.getBoundingClientRect();

    const b =
        noBtn.getBoundingClientRect();

    const maxX =
        Math.max(
            5,
            a.width - b.width - 5
        );

    const maxY =
        Math.max(
            5,
            a.height - b.height - 5
        );

    noBtn.style.left =
        Math.floor(
            Math.random() * maxX
        ) + "px";

    noBtn.style.top =
        Math.floor(
            Math.random() * maxY
        ) + "px";

    escapes++;

    runMsg.textContent =
        "Nice try 😏";
}


noBtn.addEventListener(
    "mouseenter",
    moveNo
);

noBtn.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        moveNo();

    },
    {passive:false}
);


/* ================================
   LOAD CUSTOM PROPOSAL
================================ */

async function loadProposal(){

    if(!proposalId){

        console.log(
            "No proposal ID. Using default."
        );

        return;

    }

    try{

        console.log(
            "Loading:",
            proposalId
        );


        const doc =
            await db
            .collection("proposals")
            .doc(proposalId)
            .get();


        if(!doc.exists){

            console.error(
                "Proposal does not exist."
            );

            return;

        }


        const data =
            doc.data();


        console.log(
            "CUSTOM DATA:",
            data
        );


        /* QUESTION */

        if(data.question){

            document
            .getElementById("question")
            .textContent =
            data.question;

        }


        /* MESSAGE */

        if(data.message){

            document
            .getElementById("message")
            .textContent =
            data.message;

        }


        /* YES */

        if(data.yesText){

            document
            .getElementById("yesBtn")
            .textContent =
            data.yesText;

        }


        /* NO */

        if(data.noText){

            document
            .getElementById("noBtn")
            .textContent =
            data.noText;

        }


        /* PAGE 2 */

        if(data.person){

            document
            .getElementById("page2Title")
            .innerHTML =
            "I GOT U 😋<br>" +
            data.person;

        }


        /* FINAL MESSAGE */

        if(data.finalMessage){

            document
            .getElementById("finalMessage")
            .innerHTML =
            data.finalMessage
            .replace(/\n/g,"<br>");

        }


        /* DATE & TIME TEXT */

        if(data.dateText){

            document
            .getElementById("dateText")
            .textContent =
            data.dateText;

        }


        
        /* PROPOSER */

        if(data.proposer){

            document
            .getElementById("madeBy")
            .textContent =
            "Made with ❤️ by " +
            data.proposer;

        }


        /* THEME */

        const themes = {

            pink:{
                background:
                "linear-gradient(135deg,#fff7fa,#ffe5ef)",
                color:"#7d2849",
                button:"#e83e8c"
            },

            red:{
                background:
                "linear-gradient(135deg,#fff5f5,#ffe0e0)",
                color:"#8b1e1e",
                button:"#e53935"
            },

            purple:{
                background:
                "linear-gradient(135deg,#faf5ff,#eadcff)",
                color:"#5b2a86",
                button:"#8e44ad"
            },

            blue:{
                background:
                "linear-gradient(135deg,#f5fbff,#dff1ff)",
                color:"#185a7d",
                button:"#2196f3"
            },
            
            green:{
                background:
                "linear-gradient(135deg,#f5fff7,#dff7e5)",
                color:"#176b3a",
                button:"#28a745"
            },

            orange:{
                background:
                "linear-gradient(135deg,#fff8f0,#ffe5cc)",
                color:"#9a4d00",
                button:"#ff8c00"
            },

            yellow:{
                background:
                "linear-gradient(135deg,#fffef0,#fff3b8)",
                color:"#806600",
                button:"#f1c40f"
            },

            teal:{
                background:
                "linear-gradient(135deg,#f0fffe,#d5f5f2)",
                color:"#146b68",
                button:"#14a3a0"
            },

            cyan:{
                background:
                "linear-gradient(135deg,#f0fcff,#d5f3ff)",
                color:"#126078",
                button:"#00a9d6"
            },

            lavender:{
                background:
                "linear-gradient(135deg,#fbf7ff,#e8ddff)",
                color:"#663b91",
                button:"#9b59b6"
            },

            rose:{
                background:
                "linear-gradient(135deg,#fff5f8,#ffdce8)",
                color:"#9c3157",
                button:"#e75480"
            },

            mint:{
                background:
                "linear-gradient(135deg,#f3fff9,#d8f5e8)",
                color:"#19704b",
                button:"#20b878"
            },

            dark:{
                background:
                "linear-gradient(135deg,#292929,#111111)",
                color:"#ffffff",
                button:"#e83e8c"
            },

            gold:{
                background:
                "linear-gradient(135deg,#fffaf0,#f7e7b5)",
                color:"#755b16",
                button:"#d4a017"
            }

            

        };


        const theme =
            themes[data.theme];


        if(theme){

            document.body.style.background =
                theme.background;

            document.body.style.color =
                theme.color;


            document
            .querySelectorAll(".yes,.next")
            .forEach(button => {

                button.style.background =
                    theme.button;

            });

        }

    }

    catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );

    }

}


/* ================================
   YES BUTTON
================================ */

document
.getElementById("yesBtn")
.onclick = async function(){

    if(!proposalId){

        showPage(2);

        confetti();

        return;

    }


    try{

        await db
        .collection("proposals")
        .doc(proposalId)
        .update({

            answer:"YES",

            noButtonEscapes:
            escapes,

            answeredAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

        });


        console.log(
            "YES saved"
        );

    }

    catch(error){

        console.error(
            "YES save error:",
            error
        );

    }


    showPage(2);

    confetti();

};


/* ================================
   PAGE 2 BUTTON
================================ */

document
.getElementById("page2Btn")
.onclick = function(){

    showPage(3);

};


/* ================================
   REPLY PAGE BUTTON
================================ */

document
.getElementById("replyPageBtn")
.onclick = function(){

    showPage(5);

};


/* ================================
   DATE BUTTON
================================ */

document
.getElementById("dateBtn")
.onclick = async function(){

    const date =
        document
        .getElementById("date")
        .value;

    const time =
        document
        .getElementById("time")
        .value;

    const msg =
        document
        .getElementById("dateMsg");


    if(!date || !time){

        msg.textContent =
        "Pick a date and time first ❤️";

        return;

    }


    if(!proposalId){

        msg.textContent =
        "Proposal link is missing.";

        return;

    }


    msg.textContent =
    "Saving your date... ❤️";


    try{

        await db
        .collection("proposals")
        .doc(proposalId)
        .update({

            weddingDate:
            date,

            weddingTime:
            time,

            dateSavedAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

        });


        msg.textContent =
        "Date saved successfully! ❤️";


        setTimeout(
            function(){

                showPage(4);

                confetti();

            },
            500
        );


    }

    catch(error){

        console.error(
            "DATE ERROR:",
            error
        );

        msg.textContent =
        "Something went wrong. Please try again ❤️";

    }

};

/* ================================
   REPLY BUTTON
================================ */

document
.getElementById("replyBtn")
.onclick = async function(){

    const reply =
        document
        .getElementById("replyMessage")
        .value
        .trim();

    const msg =
        document
        .getElementById("replyMsg");


    if(!reply){

        msg.textContent =
            "Write a message first ❤️";

        return;

    }


    if(!proposalId){

        msg.textContent =
            "Proposal link is missing.";

        return;

    }


    msg.textContent =
        "Sending your reply... ⏳";


    try{

        await db
        .collection("proposals")
        .doc(proposalId)
        .update({

            replyMessage: reply,

            repliedAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        });


        msg.textContent =
            "Reply sent successfully! ❤️";


        document
        .getElementById("replyBtn")
        .disabled = true;


    }

    catch(error){

        console.error(
            "REPLY ERROR:",
            error
        );

        msg.textContent =
            "Something went wrong. Please try again ❤️";

    }

};


/* ================================
   CONFETTI
================================ */

function confetti(){

    const pieces = [
        "💖",
        "❤️",
        "🎉",
        "🎊",
        "✨",
        "💍",
        "🌸"
    ];


    for(
        let i = 0;
        i < 55;
        i++
    ){

        const el =
            document.createElement("div");

        el.className =
            "confetti";

        el.textContent =
            pieces[
                Math.floor(
                    Math.random() *
                    pieces.length
                )
            ];

        el.style.left =
            Math.random() *
            100 +
            "vw";

        el.style.animationDelay =
            Math.random() *
            1.2 +
            "s";

        document.body.appendChild(el);


        setTimeout(
            () => el.remove(),
            4200
        );

    }

}


/* ================================
   START
================================ */

loadProposal().finally(() => {
    document.body.classList.remove("loading");
});

</script>

</body>
</html>
